---
# ===========================================================================
# test_network_logic.yml
#
# Exercise the two network evaluation files against recorded fixtures.
# No device, no network, no credentials.
#
# ---------------------------------------------------------------------------
# WHAT THIS PROVES
# ---------------------------------------------------------------------------
#   snmp_capability_probe  "No Such Object" arrives on stdout with rc 0. A
#                          probe that trusts the return code writes that
#                          sentence into the capability matrix as a value and
#                          reports the OID supported. It must FAIL.
#
#                          And a timeout must SKIP rather than FAIL: recording
#                          "no reply" as "unsupported" lets a brief outage
#                          mark a whole platform family permanently, in a file
#                          that is then believed.
#
#   host_key_trust         A device presenting a DIFFERENT key must FAIL. A
#                          check keyed on the hostname passes it, which
#                          defeats the only thing a trust store is for.
#
#                          And an unreachable device must SKIP: an empty scan
#                          compared against a stored key looks identical to a
#                          mismatch, and a host-key mismatch is an alarm
#                          somebody acts on at two in the morning.
#
# Both headline cases look like results, which is why neither is visible in
# production. The controls are pinned too: a real value must still PASS and a
# matching key must still PASS, or the guards would be passing by rejecting
# everything.
#
# ---------------------------------------------------------------------------
# RUNNING
# ---------------------------------------------------------------------------
#   ansible-playbook -i localhost, tests/test_network_logic.yml
#
# Explicit inventory: the project inventory carries group_vars that set
# ansible_connection, which outranks the play-level keyword and would send
# these tasks at a device. See docs/gotchas.md entry 4.
# ===========================================================================

- name: Fixture-based evaluation of the network playbook logic
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - fixtures/network/cases.yml

  tasks:
    - name: Evaluate every fixture case
      ansible.builtin.include_tasks: run_one_check_case.yml
      loop: "{{ network_cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"


    - name: The suite actually asserted something
      # Added after a rename left this suite reading accumulators the runner
      # no longer set. It reported "All 0 assertions across 16 cases" and
      # exited 0 -- a green suite that checked nothing. That is the shape
      # docs/gotchas.md entry 8 describes, and the runner's own comment warns
      # about it one level down while the suite had no way to notice.
      #
      # Counting the expectations in the fixtures and comparing gives the
      # suite something it cannot satisfy by doing nothing.
      ansible.builtin.assert:
        that:
          - (_chk_assertions | default(0) | int) == (_expected_assertions | int)
        fail_msg: >-
          Expected {{ _expected_assertions }} assertions from the fixtures but
          the harness recorded {{ _chk_assertions | default(0) }}. The suite is not
          running what it thinks it is running.
        success_msg: >-
          {{ _chk_assertions }} assertions recorded, matching the fixtures.
      vars:
        _expected_assertions: >-
          {{ network_cases | map(attribute='expect') | map('length') | sum }}

    - name: Report suite outcome
      ansible.builtin.debug:
        msg:
          - "cases:      {{ network_cases | length }}"
          - "assertions: {{ _chk_assertions | default(0) }}"
          - "failed:     {{ _chk_failed | default([]) | length }}"

    - name: Fail the suite if any case diverged
      ansible.builtin.assert:
        that:
          - (_chk_failed | default([])) | length == 0
        fail_msg: |-
          Divergent cases:
          {{ (_chk_failed | default([])) | join('
          ') }}
        success_msg: >-
          All {{ _chk_assertions | default(0) }} assertions across
          {{ network_cases | length }} cases behaved as specified.
