---
# ===========================================================================
# run_one_linux_case.yml
#
# Drive a single fixture case through the real evaluation logic and compare
# every check status against what the fixture specifies.
#
# ONE RUNNER FOR THREE EVALUATIONS. It works because all three files in
# playbooks/linux/tasks/ emit the same contract -- check_results and check_verdict
# -- so the case only has to name which file to include. Adopting one status
# vocabulary across the group is what buys this; three runners differing only
# in a variable name would be three things to keep in step.
#
# Divergences are ACCUMULATED rather than raised immediately. Failing on the
# first mismatch hides the rest, and when a shared guard regresses the useful
# signal is the full list of what broke together -- one failure looks like a
# typo, four failures spanning every numeric guard identifies the cause.
# ===========================================================================

- name: "{{ case.name }}: run the real evaluation logic"
  # The production task file, unmodified. Testing a reimplementation would
  # prove only that the reimplementation is self-consistent.
  ansible.builtin.include_tasks: "../playbooks/linux/tasks/{{ case.evaluate }}"
  vars:
    lx_facts: "{{ case.facts }}"

- name: "{{ case.name }}: index results by check name"
  ansible.builtin.set_fact:
    _lx_effective: >-
      {{ dict(check_results | map(attribute='check')
              | zip(check_results | map(attribute='status')))
         | combine({'verdict': check_verdict}) }}

- name: "{{ case.name }}: compare each expectation against the actual status"
  # A loop with a `when`, rather than a selectattr chain. selectattr cannot
  # reference the element under test while also indexing another structure by
  # that element's key.
  ansible.builtin.set_fact:
    _lx_failed: >-
      {{ (_lx_failed | default([]))
         + [case.name ~ ' :: ' ~ exp.key
            ~ ' :: expected ' ~ exp.value
            ~ ', got ' ~ (_lx_effective[exp.key] | default('<absent>'))] }}
  loop: "{{ case.expect | dict2items }}"
  loop_control:
    loop_var: exp
    label: "{{ exp.key }}"
  when: exp.value != (_lx_effective[exp.key] | default('<absent>'))

- name: "{{ case.name }}: count the assertions made"
  # Counted separately from the divergence accumulator. Folding the two
  # together would only increment on a failure, so a suite that asserted
  # nothing at all would report zero failures and read as green.
  ansible.builtin.set_fact:
    _lx_assertions: >-
      {{ (_lx_assertions | default(0) | int) + (case.expect | length) }}

- name: "{{ case.name }}: show the result line"
  ansible.builtin.debug:
    msg: >-
      {{ '%-46s' | format(case.name) }}
      {{ check_results | map(attribute='check')
         | zip(check_results | map(attribute='status'))
         | map('join', '=') | join('  ') }}
      => {{ check_verdict }}
