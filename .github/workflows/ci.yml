---
name: ci

# The leak check runs first and independently. If anything resembling real
# environment data reaches this repository, that job fails and the rest is
# irrelevant -- a public repo with a leaked address in it is a problem whether
# or not the YAML lints cleanly.

# Quoted deliberately. Bare `on:` is parsed as boolean true under
# YAML 1.1, which yamllint flags as a truthy violation. GitHub
# Actions treats the quoted form identically.
"on":
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly re-scan. Catches patterns added to the checker after content was
    # already merged.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  leak-check:
    name: leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the checker itself, then scan the tree
        # test_leak_check.sh asserts the negative path before the positive
        # one: the checker must reject a file of planted leaks before its
        # clean verdict on the repository means anything.
        run: bash tests/test_leak_check.sh

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Filter plugin unit tests
        # Deliberately its own job with no Ansible installed. The masking
        # filters degrade to a plain Exception subclass when
        # ansible.errors is unavailable, and this job proves that path
        # keeps working -- so the highest-risk logic in the repo stays
        # testable on any machine with python3 and nothing else.
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        # PINNED, for the same reason requirements.yml pins every collection:
        # an unpinned `pip install ansible-lint` re-resolves on every run, and
        # a new release changes the build with nothing in git to point at.
        # That is docs/gotchas.md entry 12 applied to CI's own tooling, and it
        # happened here -- 26.8.0 added var-naming[no-role-prefix] and failed a
        # commit whose only change was a refactor.
        #
        # The rule was right and the finding was real, which is the argument
        # for upgrading deliberately rather than for not upgrading. Bump these
        # in a commit of their own so the diff shows what the new version
        # found.
        #
        # Take these numbers from a resolved install, never from memory. The
        # first attempt at this pin guessed yamllint==1.35.1, which conflicts
        # with ansible-lint 26.8.0 -- the job then failed at the install step,
        # before either linter ran, which looks nothing like a lint failure.
        # To regenerate:
        #
        #   python3 -m venv /tmp/v
        #   /tmp/v/bin/pip install "ansible-core>=2.16,<2.18" ansible-lint yamllint
        #   /tmp/v/bin/pip list | grep -Ei "ansible-lint|yamllint"
        run: |
          python -m pip install --upgrade pip
          pip install \
            "ansible-core>=2.16,<2.18" \
            "ansible-lint==26.8.0" \
            "yamllint==1.38.0"

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  syntax:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18"

      - name: Stage example configuration
        # The repo ships only .example files so that no runnable config with
        # site values can be committed. CI materialises them to prove the
        # examples are themselves valid, not just illustrative.
        run: |
          cp ansible.cfg.example ansible.cfg
          cp inventory/hosts.yml.example inventory/hosts.yml
          for f in inventory/group_vars/*.yml.example; do
            cp "$f" "${f%.example}"
          done
          for f in vars/*.yml.example; do
            cp "$f" "${f%.example}"
          done

      - name: Fixture-driven logic tests
        # These exercise the evaluation layer against recorded fixtures on
        # localhost -- no device, no credentials. This is what makes the
        # TimeTicks guard testable in CI at all.
        run: ansible-playbook -i localhost, tests/test_baseline_logic.yml

      - name: Inventory row assembly test
        run: ansible-playbook -i localhost, tests/test_inventory_assembly.yml

      - name: Host row assembly test
        # --syntax-check cannot verify that this role resolves; include_role
        # is dynamic. This step is the only thing that does.
        run: |
          ANSIBLE_ROLES_PATH=./roles \
            ansible-playbook -i localhost, tests/test_host_rows.yml

      - name: Service health logic test
        run: ansible-playbook -i localhost, tests/test_service_health_logic.yml

      - name: Network playbook logic test
        run: ansible-playbook -i localhost, tests/test_network_logic.yml

      - name: Linux playbook logic test
        run: ansible-playbook -i localhost, tests/test_linux_logic.yml

      - name: Report masking tests
        # Config is already staged by the step above, so the playbooks can
        # be invoked directly rather than through tests/test_masking.sh.
        run: |
          ansible-playbook -i localhost, tests/test_report_masking.yml
          ansible-playbook -i localhost, tests/test_health_report_masking.yml
          ansible-playbook -i localhost, tests/test_listener_report_masking.yml

      - name: Install pinned collections
        # Retried, because this step reaches out to galaxy.ansible.com and a
        # transient fetch failure there is not a defect in this repository.
        # Bounded at three attempts so a genuinely bad pin still fails the
        # build rather than being papered over -- a wrong version fails all
        # three, a blip does not.
        run: |
          for attempt in 1 2 3; do
            if ansible-galaxy collection install -r requirements.yml; then
              exit 0
            fi
            echo "::warning::galaxy install attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          echo "::error::galaxy install failed three times -- check requirements.yml pins"
          exit 1

      - name: Syntax-check every playbook
        run: |
          rc=0
          while IFS= read -r pb; do
            echo "::group::$pb"
            ansible-playbook --syntax-check "$pb" || rc=1
            echo "::endgroup::"
          # -path exclusion is load-bearing. Files under tasks/ are task
          # lists, not playbooks; --syntax-check rejects them outright.
          # An unfiltered find here failed the first CI run on this repo.
          done < <(find playbooks -name '*.yml' -type f \
                     -not -path 'playbooks/*/tasks/*' | sort)
          exit $rc
  wiki:
    name: wiki build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wiki build is current
        # The wiki is generated from docs/gotchas.md and wiki/. If the two
        # diverge, the wiki keeps serving stale text while still looking like
        # a maintained source -- the documentation form of a scanner that has
        # silently stopped matching. --check fails and names the pages.
        run: python3 scripts/build_wiki.py --check

      - name: Leak check the built wiki
        # build/wiki is inside the tree, so the leak-check job already covers
        # the committed copy. This catches a generated page that would leak
        # before it is committed, on a branch where build/ was not rebuilt.
        run: |
          python3 scripts/build_wiki.py --out /tmp/wiki
          python3 scripts/leak_check.py /tmp/wiki

      - name: Internal wiki links resolve
        # A broken wiki link is invisible in review and 404s only for readers.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          d = pathlib.Path("build/wiki")
          pages = {p.stem for p in d.glob("*.md")}
          bad = []
          for p in sorted(d.glob("*.md")):
              for m in re.finditer(r'\]\((?!https?://|#)([^)]+)\)', p.read_text()):
                  target = m.group(1).split("#")[0]
                  if target and target not in pages:
                      bad.append(f"{p.name} -> {target}")
          if bad:
              print("broken wiki links:")
              for b in bad:
                  print(" ", b)
              sys.exit(1)
          print(f"ok: {len(pages)} pages, all internal links resolve")
          PY
